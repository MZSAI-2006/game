<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            transition: 0.3s ease;
            -webkit-text-stroke: 1px black;
            /* Reduced stroke for better readability on small screens */
        }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #000000, #0c1335, #000000, #000000);
            font-family: Arial, sans-serif;
            color: white;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }




        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 15px;
        }

        section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            justify-items: center;
        }

        .card {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 3/4;
            display: flex;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-flip-container {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-flip-container.flipped {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            overflow: hidden;
        }

        .card-front {
            z-index: 2;
            flex-direction: column;
            gap: 15px;
            /* background: #111; */
            overflow: hidden;
        }

        .card-front::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background-size: 400% 400%;
            z-index: -1;
            animation: rgbBorder 6s linear infinite;
            filter: blur(4px);
        }

        .true {
            color: #2ecc71 !important;
        }

        .card-front-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            width: 100%;
            padding: 10px;
            overflow: hidden;
            border-radius: 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            z-index: 1;
            background: #222;
        }

        .card-back-content {
            width: 94%;
            height: 94%;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-back img,
        .card-front-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-front-content img {
            object-fit: contain;
            filter: brightness(0.8);
        }

        /* Hover effect only on non-selected cards on devices that support hover */
        @media (hover: hover) {
            .card:not(.selected):hover .card-flip-container {
                transform: scale(1.03);
            }
        }

        /* Selected Card View (Overlay) */
        .card.selected {
            position: fixed;
            inset: 0;
            z-index: 9999;
            width: 100vw;
            height: 100vh;
            max-width: none;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            aspect-ratio: auto;
        }

        .card.selected .card-flip-container {
            width: 100%;
            max-width: 500px;
            height: 60vh;
            max-height: 700px;
        }

        .card.selected .card-front,
        .card.selected .card-back {
            width: 100%;
            height: 100%;
        }

        .contoler {
            display: none;
        }

        .back {
            display: none;
        }

        .card.selected .contoler {
            display: flex;
            gap: 20px;
        }

        .contoler button,
        .card.selected .back {
            text-transform: capitalize;
            padding: 15px 30px;
            display: flex;
            font-size: 1.5rem;
            background: linear-gradient(145deg, #111, #222);
            color: white;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
            -webkit-text-stroke: 0;
        }

        .card.selected .back {
            display: block;
            color: #e74c3c;
        }

        .contoler button:hover,
        .card.selected .back:hover {
            background: linear-gradient(145deg, #222, #333);
            transform: translateY(-2px);
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            -webkit-text-stroke: 1.5px black;
        }

        .did {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            background: black;
            color: #ffffff;
            border-radius: 10px;
            z-index: 10000;
            text-shadow: 0 0 10px #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            animation: dropWin 0.9s cubic-bezier(.2, 1.4, .6, 1) forwards;
            -webkit-text-stroke: 0;
        }

        .not.did {
            color: #ff4757;
            text-shadow: 0 0 10px #ff4757;
        }

        @keyframes rgbBorder {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes dropWin {
            0% {
                top: -200px;
                opacity: 0;
                transform: translateX(-50%) scale(0.6) rotate(-10deg);
            }

            60% {
                top: 25%;
                opacity: 1;
                transform: translateX(-50%) scale(1.2) rotate(5deg);
            }

            100% {
                top: 20%;
                transform: translateX(-50%) scale(1) rotate(0);
            }
        }

        /* Responsive Adjustments */

        /* Tablets */
        @media (max-width: 1024px) {
            section {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }

            .card.selected .card-flip-container {
                max-width: 400px;
                height: 50vh;
            }

            .contoler button,
            .back {
                padding: 12px 25px;
                font-size: 1.2rem;
            }

            .timer {
                font-size: 2.5rem;
            }

            .did {
                font-size: 2rem;
            }
        }

        /* Phones */
        @media (max-width: 600px) {
            body {
                padding: 10px 0;
            }

            section {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                border-radius: 12px;
            }

            .card-front,
            .card-back,
            .card-front::before {
                border-radius: 12px;
            }

            .card.selected {
                gap: 15px;
                padding: 10px;
            }

            .card.selected .card-flip-container {
                width: 95%;
                height: 50vh;
            }

            .contoler button,
            .back {
                padding: 10px 20px;
                font-size: 1rem;
            }

            .timer {
                font-size: 2rem;
            }

            .did {
                font-size: 1.5rem;
                padding: 15px 30px;
            }
        }

        /* Small Phones */
        @media (max-width: 380px) {
            section {
                grid-template-columns: 1fr;
                max-width: 260px;
                margin: 0 auto;
            }
        }
    </style>
</head>

    <script>
        let section = document.querySelector('section')
        let cards = document.querySelectorAll('.card')
        let item = null;
        let stop = false;

        function flipCard(cardElement) {
            const flipContainer = cardElement.querySelector('.card-flip-container');
            flipContainer.classList.add('flipped');
        }

        function unflipCard(cardElement) {
            const flipContainer = cardElement.querySelector('.card-flip-container');
            flipContainer.classList.remove('flipped');
        }

        function get_card(target_name, className, e) {
            stop = false;
            let counter = 5;
            item = e.target.closest('.' + target_name)

            if (!item) return;

            for (let x = 0; x < cards.length; x++) {
                cards[x].classList.remove(className)
            }

            item.classList.add(className)
            flipCard(item);

            let intervil = setInterval(() => {
                counter--;
                if (counter < 0) {
                    clearInterval(intervil);
                    item.classList.remove(className);

                    let point = document.createElement('span');
                    let text = document.createTextNode('WRONG');
                    point.appendChild(text);
                    point.classList.add('did');
                    point.classList.add('not');
                    document.body.appendChild(point)
                    item.classList.remove('selected')
                    unflipCard(item)

                    let intervil2 = setInterval(() => {
                        let msg = document.querySelector('.did');
                        if (msg) msg.remove();
                        clearInterval(intervil2);
                    }, 3000)

                    let timer = document.querySelectorAll('.timer');
                    for (let x = 0; x < timer.length; x++) {
                        timer[x].innerHTML = '';
                    }
                    return
                }
                if (stop) {
                    clearInterval(intervil);
                    return
                }
                item.querySelector(".timer").innerHTML = counter;
            }, 1000)

            const backBtn = item.querySelector(".back");
            const backHandler = () => {
                item.classList.remove(className)
                unflipCard(item);
                clearInterval(intervil);
                backBtn.removeEventListener('click', backHandler);
            };
            backBtn.addEventListener('click', backHandler);
        }

        section.addEventListener('click', (e) => {
            if (e.target.closest('.back')) {
                stop = true;

                let point = document.createElement('span');
                let text = document.createTextNode('WRONG');
                point.appendChild(text);
                point.classList.add('did');
                point.classList.add('not');
                document.body.appendChild(point)
                item.classList.remove('selected')
                unflipCard(item);

                let intervil = setInterval(() => {
                    let msg = document.querySelector('.did');
                    if (msg) msg.remove();
                    clearInterval(intervil);
                }, 3000)
                let timer = document.querySelectorAll('.timer');
                for (let x = 0; x < timer.length; x++) {
                    timer[x].innerHTML = '';
                }
                return
            };
            if (e.target.closest('.true')) {
                stop = true;

                let point = document.createElement('span');
                let text = document.createTextNode('GREAT');
                point.appendChild(text);
                point.className = 'did';
                document.body.appendChild(point)
                item.classList.remove('selected')
                unflipCard(item);

                let intervil = setInterval(() => {
                    let msg = document.querySelector('.did');
                    if (msg) msg.remove();
                    clearInterval(intervil);
                }, 3000)

                let timer = document.querySelectorAll('.timer');
                for (let x = 0; x < timer.length; x++) {
                    timer[x].innerHTML = '';
                }
                return
            }

            if (!e.target.closest('.selected')) {
                get_card('card', 'selected', e);
            }
        })
    </script>
